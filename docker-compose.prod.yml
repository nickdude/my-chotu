version: "3.9"

# Production compose — requires .env.prod file with real secrets
# Usage: docker-compose -f docker-compose.prod.yml --env-file .env.prod up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: mychotu_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-mychotu}
      POSTGRES_USER:     ${POSTGRES_USER:-mychotu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mychotu}"]
      interval: 10s
      timeout:  5s
      retries:  5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: mychotu_redis_prod
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mychotu_api_prod
    restart: unless-stopped
    environment:
      NODE_ENV:       production
      DATABASE_URL:   postgresql://${POSTGRES_USER:-mychotu}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mychotu}
      JWT_SECRET:     ${JWT_SECRET}
      FRONTEND_URL:   ${FRONTEND_URL}
      REDIS_URL:      redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512m

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: mychotu_web_prod
    restart: unless-stopped
    environment:
      NODE_ENV:              production
      NEXT_OUTPUT:           standalone
      NEXT_PUBLIC_API_URL:   ${NEXT_PUBLIC_API_URL:-http://nginx}
    depends_on:
      - api
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512m

  nginx:
    image: nginx:1.25-alpine
    container_name: mychotu_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    networks:
      - internal
      - public

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge
  public:
    driver: bridge
